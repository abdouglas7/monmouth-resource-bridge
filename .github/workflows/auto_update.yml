name: Auto-Update Resource Directory

on:
  schedule:
    - cron: '0 0 * * 1' # Runs automatically every Monday at midnight
  workflow_dispatch: # Allows you to trigger it manually anytime from the GitHub Actions tab

jobs:
  update-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Resource Scraper & Merger
        run: python scripts/scrape_monmouth_resources.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resources.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated resource database update" && git push)
