name: Auto-Update Community Resources

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 6:00 AM UTC
  workflow_dispatch: # Lets you run it manually with one click anytime

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Resource Scraper Script
        run: python scripts/scrape_monmouth_resources.py

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "Resource Automation Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/resources.json
          git diff --staged --quiet || (git commit -m "chore: auto-update Monmouth resource data registry" && git push)
